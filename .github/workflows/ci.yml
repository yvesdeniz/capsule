name: CI

on:
  push:
    branches: [master, development]
  pull_request:
    branches: [master, development]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # Windows only. The Windows-specific modules - smtc, snap, thumbbar - are
    # cfg-gated out everywhere else, so a Linux run would not compile them and
    # would pass while they were broken.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Frontend tests
        run: bun run test

      # The audio-device test is #[ignore]d; runners have no sound card.
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
