[package]
name = "capsule"
version = "0.3.0"
edition = "2021"
rust-version = "1.82"
description = "A fast music client for Windows"
license = "GPL-3.0-only"
default-run = "capsule"

[lib]
name = "capsule_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Backends are per-target below. keyring compiles on any platform without one,
# but silently falls back to an in-memory mock whose writes go nowhere and whose
# reads always say "no entry" - so the app decides you never signed in.
keyring = { version = "3" }
souvlaki = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
sha2 = "0.10"
# Mandated by the Subsonic protocol: auth is md5(password + salt), computed per
# request and compared server-side. Not a security choice of ours.
md5 = "0.7"
urlencoding = "2"
url = "2"
http = "1"
window-vibrancy = "0.6"
rodio = "0.21.1"
discord-rich-presence = "1.1.0"
lofty = "0.22"
walkdir = "2.5.0"

[target.'cfg(target_os = "linux")'.dependencies]
# Secret Service over D-Bus, which is what gnome-keyring and KWallet both speak.
# Sync rather than async on purpose: the async backend blocks on its own runtime
# from inside `navidrome_connect`, which is already a tokio task. `crypto-rust`
# keeps the encrypted session pure Rust instead of linking OpenSSL. libdbus is
# already a build dependency here by way of souvlaki.
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
# Frameless chrome needs raw Win32: window subclassing to answer WM_NCHITTEST
# with HTMAXBUTTON, which is what makes Windows 11 Snap Layouts appear.
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_System_Com",
  "Win32_Graphics_Gdi",
] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[features]
# Tauri enables this in dev builds; keeps devtools out of release binaries.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
